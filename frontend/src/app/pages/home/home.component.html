<main class="page-home">
  <div class="hero-card">
    <h2>Bonjour, <strong>{{ username }}</strong> 👋</h2>
    <p class="email">{{ email }}</p>

    @if (groups.length > 0) {
      <div class="groups">
        @for (g of groups; track g) {
          <span class="badge">{{ g }}</span>
        }
      </div>
    }

    <div class="quick-links">
      <a routerLink="/themes" class="btn-primary">Réviser par thème →</a>
      <a routerLink="/ressources" class="btn-secondary">Autres ressources →</a>
    </div>
  </div>
</main>
