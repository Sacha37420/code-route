version: "3.9"

networks:
  sso-net:
    external: true
    name: sso-lab_sso-net
  dev-net:
    external: true
    name: dev-net
  code-route-net:
    driver: bridge

services:

  redis:
    image: redis:7-alpine
    container_name: code-route-redis
    restart: unless-stopped
    networks:
      - code-route-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: code-route-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8096:8000"
    networks:
      - sso-net
      - dev-net
      - code-route-net
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/code-route-api/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 8000}}"

  worker:
    build: ./backend
    container_name: code-route-worker
    restart: unless-stopped
    env_file: .env
    command: celery -A config worker --loglevel=info --concurrency=2
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dev-net
      - code-route-net

  frontend:
    build: ./frontend
    container_name: code-route-frontend
    restart: unless-stopped
    # Uniquement les variables que lit nginx-entrypoint.sh pour écrire env.js —
    # aucune n'est secrète (env.js est servi au navigateur). `env_file: .env`
    # donnait à ce conteneur nginx tous les secrets de l'app.
    environment:
      DOMAIN: ${DOMAIN:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      PORT_BACKEND: ${PORT_BACKEND:-}
      PORT_FRONTEND: ${PORT_FRONTEND:-}
    ports:
      - "4200:80"
    networks:
      - sso-net
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/code-route/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 80}}"
